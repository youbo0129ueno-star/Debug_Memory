[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "debug-memory"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["PyYAML"]

[project.scripts]
debug-memory = "debug_memory.cli:main"

[tool.setuptools.packages.find]
include = ["debug_memory*"]
